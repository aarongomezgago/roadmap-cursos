services:
  postgres:
    image: postgres:18.6
    container_name: learnity_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-learnity_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learnity_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-learnity_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: learnity_backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://learnity_user:learnity_secret_pass@postgres:5432/learnity_db}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
    -   postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: learnity_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_PORT=5173
      - VITE_API_BACKEND_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data: