services:
  postgres:
    image: postgres:16-alpine
    container_name: learnity_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-learnity_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learnity_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-learnity_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learnity_user} -d ${POSTGRES_DB:-learnity_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - learnity-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: learnity_backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-learnity_user}:${POSTGRES_PASSWORD:-learnity_secret_pass}@postgres:5432/${POSTGRES_DB:-learnity_db}}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - learnity-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: learnity_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - learnity-net

volumes:
  postgres_data:

networks:
  learnity-net:
    driver: bridge